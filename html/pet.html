<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <div>
    <form action="">
      <div>
        <div>
          <h1>Pete's Pizza Delivery</h1>
        </div>
        <div>
          <h2>Online Order Form</h2>
        </div>
        <div>
          <h3>* required fields</h3>
        </div>
      </div>
      <fieldset>
        <table>

          <legend>Customer details</legend>

          <tr>
            <td><label for="name">*Name:</label></td>
            <td><input type="text" id="name" />

            </td>
          </tr>
          <tr>
            <td> <label for="address">*Address:</label></td>
            <td> <input type="text" id="address" /></td>
          </tr>
          <tr>
            <td>
              <label for="city">*Town city:</label>
            </td>
            <td><input type="text" id="city" /></td>
          </tr>
          <tr>
            <td>
              <label for="code">*Postcode:</label>
            </td>
            <td><input type="text" id="code" /></td>
          </tr>
          <tr>
            <td>
              <label for="tel">*Tel:</label>
            </td>
            <td><input type="text" id="tel" /></td>
          </tr>
          <tr>
            <td> <label for="email">*email:</label></td>
            <td> <input type="email" id="email" /></td>
          </tr>

        </table>
      </fieldset>

      <br />
      <div style="display: flex; justify-content: space-evenly">
        <div>
          <fieldset>
            <legend>Topping</legend>
            <input type="radio" id="Mar" name="top" /><label for="Mar">Marghrerita</label><br />

            <input type="radio" id="four" name="top" /><label for="four">Four Seasons</label><br />

            <input type="radio" id="meat" name="top" /><label for="meat">Meatfeast</label><br /><br />
          </fieldset>
        </div>
        <div>
          <fieldset>
            <legend>Size</legend>
            <input type="radio" id="s" name="size" /><label for="s">Small</label><br />

            <input type="radio" id="m" name="size" /><label for="m">Medium</label><br />

            <input type="radio" id="l" name="size" /><label for="l">Large</label><br /><br />
          </fieldset>
        </div>
        <div>
          <fieldset>
            <legend>Extras</legend>
            <input type="checkbox" id="mush" /><label for="mush">Mushroom</label><br />

            <input type="checkbox" id="green" /><label for="green">Green Peppers</label><br />

            <input type="checkbox" id="anch" /><label for="anch">Anchovies</label>
            <br />
            <input type="checkbox" id="extra" /><label for="extra">Extra Cheese</label><br />
          </fieldset>
        </div>
      </div>
      <fieldset>

        <legend>Delivery</legend>
        <label for="timing">Preffered delivery time:</label>
        <!-- <select name="" id="timing">
          <option value="">Morning: 9:00 Am to 12:00 Pm</option>
          <option value="">Lunch: 12:00 Pm to 4:00 Pm</option>
          <option value="">Evening: 4:00 Pm to 7:00 Pm</option>
          <option value="">Night: 7:00 Pm to 9:00 Pm</option>
        </select><br /> -->
        <input type="time" id="timing">

        <div>
          <br /><label for="description">Delivery instructions</label>
        </div>
        <br />
        <textarea id="description"></textarea>
      </fieldset>
      <div style="text-align: center">
        <br />
        <button>Submit order</button>
      </div>
    </form>
  </div>
</body>

</html>
