<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <h2>Forms</h2>
      
        <form action="hw.html">

      <fieldset>
        <legend >Enter you details</legend>
          <input type="button" /><br /><br />
          <input type="checkbox" /><br /><br />
          <input type="text" /><br />
          <br />
          <label for="id">Email :</label>
          <input
            type="email"
            id="Email"
            placeholder="Enter your email"
          /><br /><br />
          <input type="password" /><br /><br />
          <input type="number" max="9999999999" min="1000000000" /><br /><br />
          <label for="female">Gender:</label>
          <label for="male">male:</label>
          <input type="radio" id="male" name="gender" />
          <label for="female">female:</label>
          <input type="radio" id="female" name="gender" /><br /><br />
          <input type="submit" />
          <br /><br />
          <button>Submit</button><br /><br />
          <label for="city">Select your city:</label>
          <select name="city" id="city">
            <option value="">delhi</option>
            <option value="">kolkata</option>
            <option value="" selected>arunachal</option>
            <option value="">bihar</option>
            <option value="">jharkhand</option>
          </select>
        </form>
      </fieldset>
    </div>
  </body>
</html>
